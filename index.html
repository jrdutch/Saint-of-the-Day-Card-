<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saint of the Day</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --lit-hF: #6b3a2a; --lit-hT: #a0622a; --lit-ac: #8b4e32;
      --lit-tBg: #f0e6d0; --lit-tBo: #d4b896; --lit-tTx: #6b3a2a;
      --lit-qBg: #f5ede0; --lit-qBo: #8b4e32; --lit-qTx: #5a3520;
      --lit-div: #e0d0b8;
      --card-bg: #fffdf8;
      --body-bg1: #e8dcc8; --body-bg2: #c9b99a;
      --text-primary: #3a1f0e; --text-secondary: #4a3020;
      --footer-bg: #fdf8f0; --footer-text: #9a7850;
      --shimmer1: #e8dcc8; --shimmer2: #f5ede0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --card-bg: #1e1a16;
        --body-bg1: #0d0b09; --body-bg2: #1a150f;
        --text-primary: #e8d8c0; --text-secondary: #b8a890;
        --footer-bg: rgba(0,0,0,.25); --footer-text: #9a8a70;
        --shimmer1: #2a2218; --shimmer2: #3a3028;
        --lit-tBg: rgba(255,255,255,.07); --lit-tBo: rgba(255,255,255,.18); --lit-tTx: #d8cfc0;
        --lit-qBg: rgba(255,255,255,.05); --lit-qTx: #c8bfb0;
        --lit-div: rgba(255,255,255,.1);
      }
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: radial-gradient(ellipse at top, var(--body-bg1) 0%, var(--body-bg2) 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }

    .card {
      width: 100%; max-width: 420px;
      background: var(--card-bg);
      border-radius: 16px; overflow: hidden;
      box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.14), 0 0 0 1px rgba(160,120,60,.15);
    }

    .card-header {
      background: linear-gradient(135deg, var(--lit-hF) 0%, var(--lit-hT) 100%);
      padding: 1rem 1.25rem .85rem;
      display: flex; align-items: center; gap: .6rem;
      border-bottom: 2px solid #c9a227;
    }
    .card-header-icon { font-size: 1.1rem; color: #f5d78e; flex-shrink: 0; }
    .card-label { font-size: .7rem; font-family: Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #f5d78e; opacity: .85; }
    .card-date { font-size: .85rem; color: #fff; margin-top: .1rem; font-family: Arial, sans-serif; }

    .card-image-wrap { position: relative; height: 200px; overflow: hidden; }
    .card-image-wrap svg { width: 100%; height: 100%; display: block; }
    /* Bias the crop toward the top so faces in portrait paintings stay in frame */
    .card-image-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; }
    /* Dissolve the photo's base into the card instead of ending in a hard edge */
    .card-image-wrap::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 44px;
      background: linear-gradient(to bottom, transparent, var(--card-bg));
      pointer-events: none;
    }

    .card-body { padding: 1rem 1.25rem 1.25rem; }
    .card-name { font-size: 1.4rem; color: var(--text-primary); line-height: 1.2; margin-bottom: .25rem; }
    .card-feast { font-size: .9rem; font-family: Georgia, serif; font-variant: small-caps; color: var(--lit-ac); letter-spacing: .14em; margin-bottom: .85rem; }
    .card-divider { display: flex; align-items: center; gap: .6rem; border: none; margin-bottom: .85rem; }
    .card-divider::before, .card-divider::after { content: ''; flex: 1; height: 1px; }
    .card-divider::before { background: linear-gradient(to right, transparent, var(--lit-div)); }
    .card-divider::after { background: linear-gradient(to left, transparent, var(--lit-div)); }
    .card-divider span { color: var(--lit-ac); font-size: .85rem; line-height: 1; opacity: .7; }
    .card-tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .85rem; }
    .card-tag { font-size: .72rem; font-family: Arial, sans-serif; background: var(--lit-tBg); color: var(--lit-tTx); border: 1px solid var(--lit-tBo); border-radius: 20px; padding: .2rem .55rem; letter-spacing: .04em; }
    .card-bio { font-size: .88rem; color: var(--text-secondary); line-height: 1.65; margin-bottom: 1rem; }

    .card-quote { position: relative; background: var(--lit-qBg); border-left: 3px solid var(--lit-qBo); border-radius: 0 8px 8px 0; padding: .65rem .9rem .65rem 2.4rem; margin-bottom: 1rem; display: none; }
    .card-quote::before { content: '\201C'; position: absolute; left: .6rem; top: 0; font-family: Georgia, serif; font-size: 2.4rem; line-height: 1; color: var(--lit-ac); opacity: .35; }
    .card-quote.show { display: block; }
    .card-quote p { font-size: .82rem; color: var(--lit-qTx); font-style: italic; line-height: 1.55; }
    .card-quote cite { display: block; margin-top: .35rem; font-size: .72rem; font-family: Arial, sans-serif; color: var(--lit-ac); font-style: normal; opacity: .8; }

    .card-footer { display: flex; align-items: center; justify-content: space-between; padding: .7rem 1.25rem .9rem; border-top: 1px solid var(--lit-div); background: var(--footer-bg); }
    .card-source { font-size: .72rem; font-family: Arial, sans-serif; color: var(--footer-text); }
    .card-link { font-size: .75rem; font-family: Arial, sans-serif; color: var(--lit-ac); text-decoration: none; border: 1px solid var(--lit-ac); border-radius: 20px; padding: .28rem .75rem; transition: background .2s, color .2s; opacity: .85; }
    .card-link:hover { background: var(--lit-ac); color: #fff; opacity: 1; }

    .shimmer { background: linear-gradient(90deg, var(--shimmer1) 25%, var(--shimmer2) 50%, var(--shimmer1) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 4px; color: transparent !important; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <span class="card-header-icon">✝</span>
    <div>
      <div class="card-label">Catholic Saint of the Day</div>
      <div class="card-date" id="date"></div>
    </div>
  </div>

  <div class="card-image-wrap" id="illustration"></div>

  <div class="card-body">
    <h2 class="card-name shimmer" id="name" style="height:1.6rem;width:70%">&nbsp;</h2>
    <p class="card-feast shimmer" id="feast" style="height:.9rem;width:45%;margin-bottom:.85rem">&nbsp;</p>
    <div class="card-divider"><span>✠</span></div>
    <div class="card-tags" id="tags"></div>
    <p class="card-bio shimmer" id="bio" style="height:5rem;width:100%">&nbsp;</p>
    <blockquote class="card-quote" id="quote">
      <p id="quote-text"></p>
      <cite id="quote-source"></cite>
    </blockquote>
  </div>

  <div class="card-footer">
    <span class="card-source" id="source-label">Roman Catholic Calendar</span>
    <a class="card-link" id="link" href="https://www.catholic.org/saints/" target="_blank" rel="noopener">Learn More →</a>
  </div>
</div>

// Pick illustration type from saint tags/name
function getIllustration(saint) {
  const t = (saint.tags||[]).join(' ').toLowerCase();
  const n = (saint.name||'').toLowerCase();
  if (/christmas|nativity of our lord/.test(n)) return ILLUSTRATIONS.christmas(saint.name);
  if (/solemnity/.test(t) && /mary|marian|virgin|assumption|immaculate|annunciation|visitation/.test(n+t)) return ILLUSTRATIONS.marian(saint.name);
  if (/archangel/.test(t+n)) return ILLUSTRATIONS.archangel(saint.name);
  if (/apostle/.test(t)) return ILLUSTRATIONS.apostle(saint.name);
  if (/martyr/.test(t)) return ILLUSTRATIONS.martyr(saint.name);
  if (/mystic|carmelite|sacred heart/.test(t+n)) return ILLUSTRATIONS.mystic(saint.name);
  if (/friar|franciscan/.test(t+n)) return ILLUSTRATIONS.friar(saint.name);
  if (/monk|abbot|benedic/.test(t+n)) return ILLUSTRATIONS.monk(saint.name);
  if (/bishop|doctor|theologian|pope/.test(t)) return ILLUSTRATIONS.bishop(saint.name);
  if (/solemnity/.test(t)) return ILLUSTRATIONS.solemnity(saint.name);
  if (/marian|blessed virgin|mary/.test(t+n)) return ILLUSTRATIONS.marian(saint.name);
  return ILLUSTRATIONS.default(saint.name);
}

  '01-01': { name:'Mary, Mother of God', feast:'Solemnity', tags:['Solemnity','Blessed Virgin Mary','Holy Day of Obligation'], bio:'January 1st honors Mary as the Mother of God (Theotokos), proclaimed at the Council of Ephesus in 431 AD. This is the oldest Marian feast in the Western Church, celebrating her unique role as the mother of Jesus Christ, the Son of God.', quote:'My soul magnifies the Lord, and my spirit rejoices in God my Savior.', quoteSource:'Luke 1:46–47', url:'https://en.wikipedia.org/wiki/Mary,_mother_of_Jesus' },

  '02-14': { name:'Saints Cyril and Methodius', feast:'Feast Day', tags:['Apostles to the Slavs','Missionaries','Doctors of the Church'], bio:'Cyril (826–869) and Methodius (815–885) were Greek brothers who evangelized the Slavic peoples. Cyril created the Glagolitic alphabet so scripture could be translated into the Slavic language. They are co-patrons of Europe alongside Saint Benedict.', quote:'Among peoples there is only one God, one faith, one baptism.', quoteSource:'St. Cyril', url:'https://en.wikipedia.org/wiki/Saints_Cyril_and_Methodius' },
  '03-17': { name:'Saint Patrick', feast:'Feast Day', tags:['Bishop','Patron of Ireland','Missionary'], bio:'Patrick (385–461 AD) was kidnapped into Irish slavery at age 16. After escaping, he felt a divine calling to return as a missionary. He converted thousands, ordained priests, and established the Church throughout Ireland.', quote:'Christ with me, Christ before me, Christ behind me, Christ in me.', quoteSource:"St. Patrick's Breastplate", url:'https://en.wikipedia.org/wiki/Saint_Patrick' },
  '03-19': { name:'Saint Joseph', feast:'Solemnity', tags:['Solemnity','Patron of the Universal Church','Worker'], bio:'Joseph was the husband of the Virgin Mary and foster father of Jesus Christ. A carpenter from Nazareth, he protected the Holy Family during the flight to Egypt and raised Jesus with great love. He is the patron of the Universal Church, workers, and fathers.', quote:'Joseph did as the angel of the Lord commanded him.', quoteSource:'Matthew 1:24', url:'https://en.wikipedia.org/wiki/Saint_Joseph' },
  '03-25': { name:'Annunciation of the Lord', feast:'Solemnity', tags:['Solemnity','Blessed Virgin Mary','Incarnation'], bio:"The Annunciation celebrates the angel Gabriel's announcement to Mary that she would conceive the Son of God. Mary's \"fiat\" marks the moment of the Incarnation, nine months before Christmas.", quote:'Behold, I am the handmaid of the Lord. Let it be done to me according to your word.', quoteSource:'Luke 1:38', url:'https://en.wikipedia.org/wiki/Annunciation' },
  '04-23': { name:'Saint George', feast:'Optional Memorial', tags:['Martyr','Patron of England','Soldier'], bio:'George (died c. 303 AD) was a Roman soldier who refused to renounce his Christian faith under Emperor Diocletian and was martyred. The legend of slaying a dragon symbolizes his defeat of evil. He is patron of England, Georgia, Portugal, and many other nations.', quote:'I am a Christian, and I will not deny my faith.', quoteSource:'St. George (traditional)', url:'https://en.wikipedia.org/wiki/Saint_George' },
  '04-29': { name:'Saint Catherine of Siena', feast:'Feast Day', tags:['Doctor of the Church','Dominican','Mystic'], bio:'Catherine of Siena (1347–1380) was a Dominican mystic, Doctor of the Church, and co-patron of Europe. Her letters urging Pope Gregory XI to return from Avignon to Rome helped end the Avignon papacy. She cared for the poor and received the stigmata.', quote:'Be who God meant you to be and you will set the world on fire.', quoteSource:'St. Catherine of Siena', url:'https://en.wikipedia.org/wiki/Catherine_of_Siena' },
  '06-13': { name:'Saint Anthony of Padua', feast:'Memorial', tags:['Doctor of the Church','Friar','Patron of Lost Things'], bio:'Anthony of Padua (1195–1231) was a Portuguese Franciscan friar renowned for passionate preaching and care for the poor. He is traditionally invoked as patron of lost things and was proclaimed a Doctor of the Church within a year of his death.', quote:'Actions speak louder than words; let your words teach and your actions speak.', quoteSource:'St. Anthony of Padua', url:'https://en.wikipedia.org/wiki/Anthony_of_Padua' },
  '06-21': { name:'Saint Aloysius Gonzaga', feast:'Memorial', tags:['Jesuit','Patron of Youth'], bio:'Aloysius Gonzaga (1568–1591) renounced his hereditary title to join the Jesuits. He died at 23 caring for plague victims in Rome. He is the patron saint of youth and Catholic students, a model of purity and self-sacrifice.', quote:'I am a piece of crooked iron and I came into religion to be made straight by the hammer of penance.', quoteSource:'St. Aloysius Gonzaga', url:'https://en.wikipedia.org/wiki/Aloysius_Gonzaga' },
  '06-24': { name:'Birth of Saint John the Baptist', feast:'Solemnity', tags:['Solemnity','Prophet','Forerunner of Christ'], bio:'John the Baptist was the last great prophet and forerunner of Jesus Christ. Born miraculously to Elizabeth and Zechariah, he baptized Jesus in the Jordan River. He is the only saint besides Mary whose birth is celebrated as a Solemnity.', quote:'He must increase, but I must decrease.', quoteSource:'John 3:30', url:'https://en.wikipedia.org/wiki/John_the_Baptist' },
  '06-27': { name:'Saint Cyril of Alexandria', feast:'Memorial', tags:['Bishop','Doctor of the Church','Theologian'], bio:'Cyril of Alexandria (376–444 AD) was Archbishop of Alexandria and one of the most important theologians of the early Church. He championed the title "Theotokos" (God-bearer) for the Virgin Mary at the Council of Ephesus in 431, defending the full unity of Christ\'s divine and human natures against the Nestorian heresy.', quote:'We confess our Lord Jesus Christ, the only begotten Son of God, perfect God and perfect man.', quoteSource:'St. Cyril of Alexandria', url:'https://en.wikipedia.org/wiki/Cyril_of_Alexandria' },
  '06-28': { name:'Saint Irenaeus', feast:'Memorial', tags:['Bishop','Doctor of the Church','Martyr'], bio:'Irenaeus (c. 130–202 AD) was Bishop of Lyon and an early Church Father who combated Gnostic heresies. His work "Against Heresies" is one of the earliest complete expositions of Christian theology, defending the apostolic tradition.', quote:'The glory of God is man fully alive, and the life of man is the vision of God.', quoteSource:'St. Irenaeus', url:'https://en.wikipedia.org/wiki/Irenaeus' },
  '06-29': { name:'Saints Peter and Paul', feast:'Solemnity', tags:['Solemnity','Apostles','Martyrs'], bio:'This solemnity celebrates Peter the fisherman, first Pope, and Paul the missionary apostle. Both were martyred in Rome under Emperor Nero around 64–68 AD. Together they represent the twin pillars of the Catholic Church.', quote:'You are the Christ, the Son of the living God.', quoteSource:'Matthew 16:16', url:'https://en.wikipedia.org/wiki/Feast_of_Saints_Peter_and_Paul' },
  '07-11': { name:'Saint Benedict', feast:'Feast Day', tags:['Monk','Abbot','Patron of Europe'], bio:'Benedict of Nursia (480–547 AD) founded Western monasticism. His Rule, emphasizing prayer and work ("Ora et Labora"), shaped European civilization for centuries. He is the patron of Europe and students.', quote:'Prefer nothing whatever to Christ, and may he lead us all together to everlasting life.', quoteSource:'St. Benedict, The Rule', url:'https://en.wikipedia.org/wiki/Benedict_of_Nursia' },
  '07-22': { name:'Saint Mary Magdalene', feast:'Feast Day', tags:['Apostle to the Apostles','Disciple','Martyr'], bio:'Mary Magdalene was the first witness of the Resurrection and the first to proclaim it, earning the title "Apostle to the Apostles." She remained at the Cross when most apostles had fled. Pope Francis elevated her feast to the rank of Feast Day in 2016.', quote:'I have seen the Lord!', quoteSource:'John 20:18', url:'https://en.wikipedia.org/wiki/Mary_Magdalene' },
  '07-25': { name:'Saint James the Apostle', feast:'Feast Day', tags:['Apostle','Martyr','Patron of Spain'], bio:'James, son of Zebedee, was one of the Twelve Apostles and the first to be martyred, executed by Herod Agrippa around 44 AD. His tomb at Santiago de Compostela in Spain became one of the greatest pilgrimage destinations of the medieval world.', quote:'Lord, we will drink the cup you drink.', quoteSource:'Mark 10:39', url:'https://en.wikipedia.org/wiki/James,_son_of_Zebedee' },
  '08-10': { name:'Saint Lawrence', feast:'Feast Day', tags:['Deacon','Martyr','Patron of the Poor'], bio:'Lawrence (225–258 AD) was one of the seven deacons of Rome. When ordered to hand over Church treasures, he gathered the poor and sick, saying "These are the treasures of the Church." He was martyred by being roasted alive under Emperor Valerian.', quote:'The Church is truly rich, far richer than your emperor.', quoteSource:'St. Lawrence (traditional)', url:'https://en.wikipedia.org/wiki/Saint_Lawrence' },
  '08-15': { name:'Assumption of the Blessed Virgin Mary', feast:'Solemnity', tags:['Solemnity','Blessed Virgin Mary','Holy Day of Obligation'], bio:'The Assumption celebrates Mary being taken body and soul into heavenly glory. Defined as dogma by Pope Pius XII in 1950, this is one of the most ancient Marian feasts and a Holy Day of Obligation for Catholics worldwide.', quote:'For he who is mighty has done great things for me, and holy is his name.', quoteSource:'Luke 1:49', url:'https://en.wikipedia.org/wiki/Assumption_of_Mary' },
  '08-28': { name:'Saint Augustine of Hippo', feast:'Memorial', tags:['Bishop','Doctor of the Church','Theologian'], bio:'Augustine (354–430 AD) is one of the greatest theologians in history. After years of searching, he converted to Christianity under Saint Ambrose. His "Confessions" and "City of God" remain masterpieces of world literature and Christian thought.', quote:'Our heart is restless until it finds its rest in Thee.', quoteSource:'St. Augustine, Confessions', url:'https://en.wikipedia.org/wiki/Augustine_of_Hippo' },
  '09-08': { name:'Nativity of the Blessed Virgin Mary', feast:'Feast Day', tags:['Feast Day','Blessed Virgin Mary','Marian'], bio:"This feast celebrates the birth of the Virgin Mary to Joachim and Anne. Observed nine months after her Immaculate Conception, it has been celebrated since the 7th century. Mary's birth is the dawn before the Sunrise of salvation.", quote:'Blessed are you among women, and blessed is the fruit of your womb.', quoteSource:'Luke 1:42', url:'https://en.wikipedia.org/wiki/Nativity_of_Mary' },
  '09-29': { name:'Sts. Michael, Gabriel & Raphael', feast:'Feast Day', tags:['Archangels','Feast Day'], bio:"Michaelmas honors the three archangels: Michael the warrior who leads God's armies, Gabriel the messenger who announced the Incarnation to Mary, and Raphael the healer. Together they represent God's protection, communication, and healing.", quote:'Behold, I send an angel before you to guard you on the way.', quoteSource:'Exodus 23:20', url:'https://en.wikipedia.org/wiki/Archangel' },
  '10-01': { name:'Saint Thérèse of Lisieux', feast:'Memorial', tags:['Doctor of the Church','Carmelite','Mystic'], bio:'Thérèse Martin (1873–1897) entered the Carmelite convent at 15 and died at 24. Her "Little Way" of doing small things with great love became one of the most influential spiritual paths in modern Catholicism. She is a Doctor of the Church.', quote:'Miss no single opportunity of making some small sacrifice, here by a smiling look, there by a kindly word.', quoteSource:'St. Thérèse of Lisieux', url:'https://en.wikipedia.org/wiki/Th%C3%A9r%C3%A8se_of_Lisieux' },
  '10-04': { name:'Saint Francis of Assisi', feast:'Memorial', tags:['Friar','Patron of Animals and Ecology'], bio:'Francis of Assisi (1181–1226) renounced his wealthy family to live the Gospel in radical poverty. He founded the Franciscan Order, received the stigmata, and composed the "Canticle of the Sun." He is patron of animals and ecology.', quote:'Lord, make me an instrument of your peace. Where there is hatred, let me sow love.', quoteSource:'Peace Prayer of St. Francis', url:'https://en.wikipedia.org/wiki/Francis_of_Assisi' },
  '10-07': { name:'Our Lady of the Rosary', feast:'Memorial', tags:['Memorial','Blessed Virgin Mary','Marian'], bio:"Established by Pope Pius V after the Christian victory at Lepanto (October 7, 1571), this feast honors Mary under the title of Our Lady of the Rosary. Meditating on the mysteries of Christ's life through repeated prayers is one of the most beloved Catholic devotions.", quote:'The Rosary is the most excellent form of prayer and the most efficacious means of attaining eternal life.', quoteSource:'Pope Leo XIII', url:'https://en.wikipedia.org/wiki/Our_Lady_of_the_Rosary' },

// ── Easter & liturgical season ────────────────────────────────────────────────
function getEaster(year) {
  const a = year % 19, b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mo = Math.floor((h + l - 7 * m + 114) / 31);
  const dy = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(year, mo - 1, dy);
}

const THEMES = {
  ordinary:  { hF:'#1a5c2e', hT:'#0d3d1e', ac:'#1a6b35', tBg:'#d8eedc', tBo:'#7ab88a', tTx:'#14542a', qBg:'#eef5ef', qBo:'#2a8a4a', qTx:'#1a4a28', div:'#b8d8c0' },
  advent:    { hF:'#4a1a6b', hT:'#280a40', ac:'#7a3aab', tBg:'#ede4f5', tBo:'#c8a8e8', tTx:'#4a1a6b', qBg:'#f3eef8', qBo:'#7a3aab', qTx:'#3a1060', div:'#c8a8e8' },
  christmas: { hF:'#7a5a00', hT:'#402e00', ac:'#a07820', tBg:'#f5ecc0', tBo:'#d4b840', tTx:'#6b4a00', qBg:'#fdf8e8', qBo:'#a07820', qTx:'#5a3a00', div:'#d4c898' },
  lent:      { hF:'#4a1a6b', hT:'#280a40', ac:'#7a3aab', tBg:'#ede4f5', tBo:'#c8a8e8', tTx:'#4a1a6b', qBg:'#f3eef8', qBo:'#7a3aab', qTx:'#3a1060', div:'#c8a8e8' },
  easter:    { hF:'#7a6000', hT:'#402e00', ac:'#b09020', tBg:'#f5ecc0', tBo:'#d4b840', tTx:'#5a3a00', qBg:'#fdf8e0', qBo:'#b09020', qTx:'#4a3000', div:'#d4c898' },
  martyr:    { hF:'#8b1a1a', hT:'#4a0808', ac:'#c04040', tBg:'#f5d8d8', tBo:'#e8a8a8', tTx:'#8b1a1a', qBg:'#fdf0f0', qBo:'#c04040', qTx:'#6b1a1a', div:'#e8c0c0' },
  virgin:    { hF:'#4a4838', hT:'#2a2820', ac:'#7a7060', tBg:'#f5f3ee', tBo:'#d8d4c8', tTx:'#4a4840', qBg:'#fdfcf8', qBo:'#a8a098', qTx:'#3a3830', div:'#dcdad5' },
  marian:    { hF:'#1a2a8b', hT:'#0d1660', ac:'#3050c0', tBg:'#d8ddf0', tBo:'#a8b0e0', tTx:'#1a2a8b', qBg:'#eef0f8', qBo:'#3050c0', qTx:'#0d1860', div:'#a8b0e0' },
};

function getLiturgicalTheme(saint) {
  const tags = (saint.tags || []).join(' ').toLowerCase();
  const name = (saint.name || '').toLowerCase();

  if (/\bmartyrs?\b/.test(tags)) return THEMES.martyr;
  if (/\bvirgins?\b/.test(tags)) return THEMES.virgin;
  if (/blessed virgin|our lady|marian/.test(tags) ||
      /our lady|immaculate|assumption|annunciation|nativity of.*mary|visitation/.test(name))
    return THEMES.marian;

  const now = new Date();
  const yr = now.getFullYear();
  const today = new Date(yr, now.getMonth(), now.getDate());
  const easter = getEaster(yr);
  const eD = new Date(easter.getFullYear(), easter.getMonth(), easter.getDate());
  const ashWed = new Date(eD); ashWed.setDate(eD.getDate() - 46);
  const pentecost = new Date(eD); pentecost.setDate(eD.getDate() + 49);

  if (today >= ashWed && today < eD) return THEMES.lent;
  if (today >= eD && today <= pentecost) return THEMES.easter;

  const dec25 = new Date(yr, 11, 25);
  const jan6dow = new Date(yr, 0, 6).getDay();
  const baptism = new Date(yr, 0, jan6dow === 0 ? 13 : 6 + (7 - jan6dow));
  if (today >= dec25 || (today.getMonth() < 2 && today <= baptism)) return THEMES.christmas;

  const dec25dow = dec25.getDay();
  const adventStart = new Date(yr, 11, 25 - (dec25dow === 0 ? 28 : dec25dow + 21));
  if (today >= adventStart) return THEMES.advent;

  return THEMES.ordinary;
}

function applyTheme(t) {
  const r = document.documentElement;
  r.style.setProperty('--lit-hF', t.hF); r.style.setProperty('--lit-hT', t.hT);
  r.style.setProperty('--lit-ac', t.ac);
  r.style.setProperty('--lit-tBg', t.tBg); r.style.setProperty('--lit-tBo', t.tBo); r.style.setProperty('--lit-tTx', t.tTx);
  r.style.setProperty('--lit-qBg', t.qBg); r.style.setProperty('--lit-qBo', t.qBo); r.style.setProperty('--lit-qTx', t.qTx);
  r.style.setProperty('--lit-div', t.div);
}

// ── RSS parser ────────────────────────────────────────────────────────────────
function parseRSS(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.querySelector('parsererror')) return null;
  const items = Array.from(doc.getElementsByTagName('item'));
  if (!items.length) return null;

  // Prefer the item published today; otherwise accept the newest item only if
  // it is fresh (< 36h old) so a dead feed never shows a stale saint.
  const now = new Date();
  const pubOf = it => new Date(it.getElementsByTagName('pubDate')[0]?.textContent || '');
  const sameDay = d => !isNaN(d) && d.getFullYear() === now.getFullYear() &&
                       d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
  let item = items.find(it => sameDay(pubOf(it)));
  if (!item) {
    const pd = pubOf(items[0]);
    if (isNaN(pd) || now - pd > 36 * 3600 * 1000) return null;
    item = items[0];
  }

  // getElementsByTagName handles the media: namespace reliably; querySelector doesn't.
  const g = tag => item.getElementsByTagName(tag)[0]?.textContent?.trim() || '';
  const title = g('title');
  if (!title) return null;
  const link = g('link') || 'https://www.catholic.org/saints/';

  let imageUrl = item.getElementsByTagName('media:content')[0]?.getAttribute('url') || '';
  const tmp = document.createElement('div');
  tmp.innerHTML = g('description');
  if (!imageUrl) imageUrl = tmp.querySelector('img')?.src || '';
  tmp.querySelectorAll('img').forEach(el => el.remove());
  const bio = tmp.textContent.replace(/\s+/g,' ').trim();

  return { name:title, feast:'Feast Day', tags:['Catholic','Saint of the Day'], bio: bio || 'Visit the link below to read the full biography.', url:link, imageUrl, source:'uCatholic' };
}

// ── Render ────────────────────────────────────────────────────────────────────
function showSaint(s) {
  applyTheme(getLiturgicalTheme(s));

  ['name','feast','bio'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('shimmer');
    el.removeAttribute('style');
  });

  document.getElementById('name').textContent  = s.name;
  document.getElementById('feast').textContent = s.feast;
  document.getElementById('bio').textContent   = s.bio;

  document.getElementById('tags').innerHTML = (s.tags||[])
    .map(t => `<span class="card-tag">${t.replace(/&/g,'&amp;')}</span>`).join('');

  if (s.quote) {
    document.getElementById('quote-text').textContent   = `"${s.quote}"`;
    document.getElementById('quote-source').textContent = `— ${s.quoteSource||''}`;
    document.getElementById('quote').classList.add('show');
  }

  const wrap = document.getElementById('illustration');
  if (s.imageUrl) {
    wrap.innerHTML = '';
    const img = document.createElement('img');
    img.alt = s.name;
    img.loading = 'lazy';
    img.onerror = () => { wrap.innerHTML = getIllustration(s); };
    img.src = s.imageUrl;
    wrap.appendChild(img);
  } else {
    wrap.innerHTML = getIllustration(s);
  }
  document.getElementById('source-label').textContent = s.source || 'Roman Catholic Calendar';
  document.getElementById('link').href = s.url || 'https://www.catholic.org/saints/';
}

// ── Boot ──────────────────────────────────────────────────────────────────────
document.getElementById('date').textContent = new Date().toLocaleDateString('en-US', {
  weekday:'long', month:'long', day:'numeric', year:'numeric'
});

// Auto-refresh at midnight so the card updates to the next day's saint
(function scheduleMidnightRefresh() {
  const now = new Date();
  const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  setTimeout(() => location.reload(), midnight - now + 1000);
})();

// Timers get throttled on background tabs and sleeping wall tablets, so also
// reload whenever the page becomes visible again on a new day.
const RENDERED_DATE = new Date().getDate();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && new Date().getDate() !== RENDERED_DATE) {
    location.reload();
  }
});

// rss.app serves the XML without CORS headers, so a direct browser fetch is
// blocked. rss2json.com exists for exactly this: it fetches the feed
// server-side and returns JSON with CORS enabled. Generic relays as backup.
const FEED_URL = 'https://rss.app/feeds/1tWSQDMDaOnerbi9.xml';
const FEED_ENC = encodeURIComponent(FEED_URL);
const FEED_ATTEMPTS = [
  { url: 'https://api.rss2json.com/v1/api.json?rss_url=' + FEED_ENC, rss2json: true },
  { url: FEED_URL },
  { url: 'https://corsproxy.io/?url=' + FEED_ENC },
  { url: 'https://api.codetabs.com/v1/proxy?quest=' + FEED_ENC },
  { url: 'https://api.allorigins.win/get?url=' + FEED_ENC, json: true },
];

// rss2json item dates are "YYYY-MM-DD HH:MM:SS" in UTC.
function parseRSS2JSON(data) {
  if (!data || data.status !== 'ok' || !Array.isArray(data.items) || !data.items.length) return null;
  const now = new Date();
  const pubOf = it => new Date(String(it.pubDate || '').replace(' ', 'T') + 'Z');
  const sameDay = d => !isNaN(d) && d.getFullYear() === now.getFullYear() &&
                       d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
  let item = data.items.find(it => sameDay(pubOf(it)));
  if (!item) {
    const pd = pubOf(data.items[0]);
    if (isNaN(pd) || now - pd > 36 * 3600 * 1000) return null;
    item = data.items[0];
  }
  const title = (item.title || '').trim();
  if (!title) return null;
  let imageUrl = item.thumbnail || item.enclosure?.link || '';
  const tmp = document.createElement('div');
  tmp.innerHTML = item.description || '';
  if (!imageUrl) imageUrl = tmp.querySelector('img')?.src || '';
  tmp.querySelectorAll('img').forEach(el => el.remove());
  const bio = tmp.textContent.replace(/\s+/g, ' ').trim();
  return { name: title, feast: 'Feast Day', tags: ['Catholic', 'Saint of the Day'], bio: bio || 'Visit the link below to read the full biography.', url: item.link || 'https://www.catholic.org/saints/', imageUrl, source: 'uCatholic' };
}

async function fetchSaint() {
  console.info('Saint card v1.2.4: fetching feed…');
  for (const a of FEED_ATTEMPTS) {
    const host = new URL(a.url).host;
    try {
      const r = await fetch(a.url, { signal: AbortSignal.timeout(8000) });
      if (!r.ok) { console.info(`Saint card: ${host} → HTTP ${r.status}`); continue; }
      let saint, bodyPreview = '';
      if (a.rss2json) {
        const data = await r.json();
        saint = parseRSS2JSON(data);
        if (!saint) bodyPreview = JSON.stringify(data).slice(0, 120);
      } else {
        const xml = a.json ? (await r.json()).contents : await r.text();
        saint = xml ? parseRSS(xml) : null;
        if (!saint) bodyPreview = String(xml).slice(0, 120);
      }
      console.info(`Saint card: ${host} → 200, parsed=${!!saint}` +
                   (saint ? '' : `, body starts: ${bodyPreview}`));
      if (saint) return saint;
    } catch(e) {
      console.info(`Saint card: ${host} → ${e.name}: ${e.message}`);
    }
  }
  console.info('Saint card: all feed attempts failed, using cached/embedded data.');
  return null;
}

(async () => {
  const CACHE_KEY = 'saint-of-day-cache';
  let saint = await fetchSaint();

  const d = new Date();
  const key = String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');

  if (saint) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ key, saint })); } catch(e) {}
  } else {
    // Feed unreachable — reuse today's earlier successful fetch if we have one.
    try {
      const c = JSON.parse(localStorage.getItem(CACHE_KEY));
      if (c && c.key === key) saint = c.saint;
    } catch(e) {}
  }

  // RSS returns only generic metadata — enrich from the curated dataset so
  // liturgical colors (martyr, virgin, marian), the true feast rank, and a
  // quote all survive regardless of data source.
  if (saint && SAINTS[key]) {
    saint.tags = SAINTS[key].tags;
    saint.feast = SAINTS[key].feast;
    if (!saint.quote) { saint.quote = SAINTS[key].quote; saint.quoteSource = SAINTS[key].quoteSource; }
  }

  if (!saint) {
    saint = SAINTS[key] || {
      name:'Saints of the Roman Calendar', feast:'Feast Day',
      tags:['Catholic','Holy Men and Women'],
      bio:"The Church honors saints every day of the year — holy men and women who bore witness to Christ through heroic virtue. Visit catholic.org to discover today's saint.",
      quote:'To be a saint is not a luxury but a necessity.', quoteSource:'Pope St. John Paul II',
      url:'https://www.catholic.org/saints/', source:'Roman Catholic Calendar',
    };
  }


  showSaint(saint);
})();
